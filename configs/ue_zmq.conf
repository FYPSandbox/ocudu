# Matching srsUE configuration for configs/gnb_zmq_srsue.yml.

[rf]
freq_offset = 0
tx_gain = 60
rx_gain = 60

srate = 11.52e6
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=11.52e6
# Keep feeding uplink samples to OCUDU's blocking ZMQ baseband loop even
# before PRACH. The srsUE automatic mode otherwise selects burst TX for ZMQ.
continuous_tx = yes

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63bfa50ee6523365ff14c1f45f88737d
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = embb
apn_protocol = ipv4
force_imsi_attach = false
eia = 1,2,3
eea = 0,1,2,3
[slicing]
enable = true
nssai-sst = 1
nssai-sd = 1


[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
